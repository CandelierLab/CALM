<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALM — Collective Animal Locomotion Models</title>
<meta name="description" content="Simulateur interactif de modèles de locomotion animale collective.">
<link rel="stylesheet" href="css/calm.css">
</head>
<body>

<aside id="panel">

  <header>
    <div class="titles">
      <h1>CALM</h1>
      <p id="subtitle"></p>
    </div>
    <div class="switches">
      <div id="langs"></div>
      <div id="dims"></div>
      <button type="button" id="theme" aria-label="Thème">◐</button>
    </div>
  </header>

  <div class="actions">
    <button type="button" id="shuffle"></button>
    <button type="button" id="play"></button>
    <button type="button" id="reset"></button>
  </div>

  <section>
    <h2 id="general-title"></h2>
    <div id="general-params"></div>
  </section>

  <section>
    <label for="model-select" id="model-label"></label>
    <select id="model-select"></select>

    <figure>
      <img id="illustration" src="" alt="">
    </figure>

    <p id="description"></p>

    <h2 id="params-title"></h2>
    <div id="model-params"></div>
  </section>

</aside>

<main id="stage">
  <!-- Two canvases, one shown at a time: a canvas holds either a 2D context
       or a WebGL one, never both. -->
  <canvas id="view"></canvas>
  <canvas id="view3d" hidden></canvas>
</main>

<!-- three.js, vendored rather than loaded from a CDN so the tests run offline
     and the deployed page has no third-party dependency at runtime. Its UMD
     build defines the global THREE, so it must load before the module. -->
<script src="vendor/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
